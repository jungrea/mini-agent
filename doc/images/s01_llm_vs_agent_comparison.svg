<svg viewBox="0 0 680 320" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>传统大语言模型 vs Agent对话模式对比</title>
  <desc>对比传统LLM单次对话与Agent调用工具的处理流程</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .t { font-family: sans-serif; font-size: 14px; font-weight: 500; fill: #26215C; }
    .ts { font-family: sans-serif; font-size: 12px; font-weight: 400; fill: #534AB7; }
    .th { font-family: sans-serif; font-size: 14px; font-weight: 500; fill: #3C3489; }
    .box { fill: #EEEDFE; stroke: #7F77DD; stroke-width: 0.5; }
    .arr { stroke: #534AB7; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .section-title { font-family: sans-serif; font-size: 13px; font-weight: 500; fill: #5F5E5A; }
  </style>
  <rect class="box" x="20" y="40" width="640" height="56" rx="8"/>
  <text class="t" x="340" y="73" text-anchor="middle" dominant-baseline="central">传统大语言模型（Traditional LLM）</text>

  <rect class="box" x="20" y="130" width="640" height="56" rx="8"/>
  <text class="t" x="340" y="163" text-anchor="middle" dominant-baseline="central">Agent 对话模式（Agent with Tools）</text>

  <g class="node c-blue">
    <rect x="60" y="220" width="100" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="110" y="242" text-anchor="middle" dominant-baseline="central">用户输入</text>
  </g>
  <path class="arr" d="M165 242 L205 242"/>

  <g class="node c-blue">
    <rect x="210" y="220" width="100" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="260" y="242" text-anchor="middle" dominant-baseline="central">LLM 回复</text>
  </g>
  <path class="arr" d="M315 242 L355 242"/>

  <g class="node c-gray">
    <rect x="360" y="220" width="100" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="410" y="242" text-anchor="middle" dominant-baseline="central">结束</text>
  </g>

  <text class="section-title" x="60" y="200">流程:</text>

  <g class="node c-blue">
    <rect x="60" y="290" width="80" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="100" y="312" text-anchor="middle" dominant-baseline="central">用户输入</text>
  </g>
  <path class="arr" d="M145 312 L185 312"/>

  <g class="node c-purple">
    <rect x="190" y="290" width="100" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="240" y="312" text-anchor="middle" dominant-baseline="central">LLM 判断</text>
  </g>
  <path class="arr" d="M295 312 L335 312"/>

  <g class="node c-teal">
    <rect x="340" y="290" width="100" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="390" y="312" text-anchor="middle" dominant-baseline="central">执行工具</text>
  </g>
  <path class="arr" d="M445 312 L485 312"/>

  <g class="node c-purple">
    <rect x="490" y="290" width="100" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="540" y="312" text-anchor="middle" dominant-baseline="central">LLM 整合</text>
  </g>
  <path class="arr" d="M595 312 L610 312" marker-end="none"/>

  <text class="section-title" x="60" y="270">流程:</text>

  <g class="node c-gray">
    <rect x="540" y="220" width="100" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="590" y="242" text-anchor="middle" dominant-baseline="central">最终回复</text>
  </g>

  <path d="M490 334 L540 252" stroke="#534AB7" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

</svg>